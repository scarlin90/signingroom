server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # First check if the request matches a real file ($uri) or directory ($uri/)
        # If not, fall back to index.html so Angular's router handles the path
        try_files $uri $uri/ /index.html;
    }

    # Cache static JS/CSS assets for better performance
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}