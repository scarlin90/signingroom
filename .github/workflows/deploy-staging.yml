name: Deploy Staging Environment

on:
  workflow_run:
    workflows: ['CI Test Suite']
    branches: ['staging']
    types:
      - completed

permissions:
  contents: read
  deployments: write
  packages: write

jobs:
  deploy-staging-environment:
    runs-on: ubuntu-latest
    environment: staging

    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Angular Client (Nx)
        run: npx nx build client --configuration=hosted-staging

      - name: Deploy Frontend to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'signingroom-web-staging'
          directory: 'dist/apps/client/browser'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: 'staging'

      - name: Deploy Backend to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging
          workingDirectory: 'apps/worker'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Worker Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/worker:staging
            ghcr.io/${{ github.repository }}/worker:staging-${{ github.sha }}

      - name: Build and Push Client Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.client
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/client:staging
            ghcr.io/${{ github.repository }}/client:staging-${{ github.sha }}
