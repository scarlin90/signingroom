name: Reusable Deployment Pipeline

on:
  workflow_call:
    inputs:
      target_env:
        required: true
        type: string
      nx_config:
        required: true
        type: string
      docker_tag:
        required: true
        type: string
      pages_project:
        required: true
        type: string
      pages_branch:
        required: true
        type: string
      wrangler_args:
        required: false
        type: string
        default: 'deploy'
      base_url:
        required: true
        type: string
    outputs:
      worker_digest:
        description: 'SHA digest for worker image'
        value: ${{ jobs.deploy.outputs.worker_digest }}
      client_digest:
        description: 'SHA digest for client image'
        value: ${{ jobs.deploy.outputs.client_digest }}

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    outputs:
      worker_digest: ${{ steps.push_worker.outputs.digest }}
      client_digest: ${{ steps.push_client.outputs.digest }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Software Bill of Materials (SBOM)
        run: npx @cyclonedx/cyclonedx-npm --package-lock-only --output-format JSON --output-file sbom-${{ inputs.target_env }}.json --ignore-npm-errors

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ inputs.target_env }}-${{ github.sha }}
          path: sbom-${{ inputs.target_env }}.json
          retention-days: 90

      - name: Scan Generated SBOM for Vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'sbom'
          format: 'sarif'
          output: 'trivy-sbom.sarif'
          scan-ref: 'sbom-${{ inputs.target_env }}.json'
          severity: 'CRITICAL'
          exit-code: '0'

      - name: Upload SBOM Trivy SARIF to GitHub UI
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        if: always()
        with:
          sarif_file: 'trivy-sbom.sarif'
          category: trivy-sbom-${{ inputs.target_env }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build Angular Client (Nx)
        run: npx nx build client --configuration=${{ inputs.nx_config }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Worker Docker Image
        id: push_worker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/worker:${{ inputs.docker_tag }}
            ghcr.io/${{ github.repository }}/worker:${{ inputs.docker_tag }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign Worker Docker Image
        run: cosign sign --yes ghcr.io/${{ github.repository }}/worker@${{ steps.push_worker.outputs.digest }}

      - name: Scan Worker Container for CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'ghcr.io/${{ github.repository }}/worker:${{ inputs.docker_tag }}-${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-worker.sarif'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Worker Trivy SARIF to GitHub UI
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        if: always() && hashFiles('trivy-worker.sarif') != ''
        with:
          sarif_file: 'trivy-worker.sarif'
          category: trivy-worker-${{ inputs.target_env }}

      - name: Build and Push Client Docker Image
        id: push_client
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.client
          push: true
          build-args: |
            BUILD_ENV=${{ inputs.nx_config }}
          tags: |
            ghcr.io/${{ github.repository }}/client:${{ inputs.docker_tag }}
            ghcr.io/${{ github.repository }}/client:${{ inputs.docker_tag }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign Client Docker Image
        run: cosign sign --yes ghcr.io/${{ github.repository }}/client@${{ steps.push_client.outputs.digest }}

      - name: Scan Client Container for CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'ghcr.io/${{ github.repository }}/client:${{ inputs.docker_tag }}-${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-client.sarif'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Client Trivy SARIF to GitHub UI
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        if: always() && hashFiles('trivy-client.sarif') != ''
        with:
          sarif_file: 'trivy-client.sarif'
          category: trivy-client-${{ inputs.target_env }}

      - name: Deploy Frontend to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/apps/client/browser --project-name=${{ inputs.pages_project }} --branch=${{ inputs.pages_branch }}

      - name: Deploy Backend to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: ${{ inputs.wrangler_args }}
          workingDirectory: 'apps/worker'

      - name: Post-Deploy Health Verification
        run: |
          echo "==> Verifying Frontend (${{ inputs.base_url }})..."
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            -A "GitHubActions-CI-HealthCheck" \
            ${{ inputs.base_url }} > /dev/null

          if [ "${{ inputs.target_env }}" = "development" ]; then
            WORKER_HEALTH_URL="https://api-dev.signingroom.io/api/health"
          elif [ "${{ inputs.target_env }}" = "staging-branded" ]; then
            WORKER_HEALTH_URL="https://api-staging-branded.signingroom.io/api/health"
          elif [ "${{ inputs.target_env }}" = "staging" ]; then
            WORKER_HEALTH_URL="https://api-staging.signingroom.io/api/health"
          else
            WORKER_HEALTH_URL="https://api.signingroom.io/api/health"
          fi

          echo "==> Verifying Worker API ($WORKER_HEALTH_URL)..."
          RESPONSE=$(curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors -A "GitHubActions-CI-HealthCheck" "$WORKER_HEALTH_URL")
          echo "Worker Response: $RESPONSE"

          if echo "$RESPONSE" | grep -q '"status":"healthy"'; then
            echo "✅ Deployment health verification passed!"
          else
            echo "❌ Worker health check failed: Unexpected payload response."
            exit 1
          fi

