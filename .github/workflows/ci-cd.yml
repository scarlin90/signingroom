name: CI/CD Pipeline

on:
  push:
    branches: ['main', 'staging', 'development']
  pull_request:
    branches: ['main', 'staging', 'development']

permissions:
  contents: write
  deployments: write
  packages: write
  pull-requests: write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Build and Run Tests
        run: |
          docker build -t signingroom-ci -f Dockerfile.test .
          docker run --name test-container signingroom-ci

      - name: Extract Coverage Summaries
        if: always()
        run: |
          docker cp test-container:/app/coverage/apps/worker/coverage-summary.json ./worker-summary.json || true
          docker cp test-container:/app/coverage/apps/client/coverage-summary.json ./client-summary.json || true
          docker cp test-container:/app/coverage/libs/sdk/coverage-summary.json ./sdk-summary.json || true

      - name: Post Worker Coverage to Summary
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: 'Worker Relay Coverage'
          json-summary-path: ./worker-summary.json

      - name: Post Client Coverage to Summary
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: 'Client Dashboard Coverage'
          json-summary-path: ./client-summary.json

      - name: Post SDK Coverage to Summary
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: 'SDK Coverage'
          json-summary-path: ./sdk-summary.json

      - name: Cleanup Docker
        if: always()
        run: docker rm -f test-container || true

      - name: Generate Automated SBOM
        if: github.event_name == 'push' && github.ref_name == 'development'
        run: |
          echo "Compiling automated Software Bill of Materials (CycloneDX)..."
          npx @cyclonedx/cyclonedx-npm --package-lock-only --output-format JSON --output-file sbom.json --ignore-npm-errors

      - name: Create Pull Request for SBOM
        if: github.event_name == 'push' && github.ref_name == 'development'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(compliance): auto-update software bill of materials (SBOM)'
          title: 'chore(compliance): update SBOM'
          body: 'Automated Software Bill of Materials (SBOM) update generated by GitHub Actions.'
          branch: auto-update-sbom
          base: development
          add-paths: sbom.json

  deploy-dev:
    needs: run-tests
    if: github.event_name == 'push' && github.ref_name == 'development'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Angular Client (Nx)
        run: npx nx build client --configuration=hosted-dev

      - name: Deploy Frontend to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'signingroom-web-dev'
          directory: 'dist/apps/client/browser'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: 'development'

      - name: Deploy Backend to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env development
          workingDirectory: 'apps/worker'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Worker Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/worker:dev
            ghcr.io/${{ github.repository }}/worker:dev-${{ github.sha }}

      - name: Build and Push Client Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.client
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/client:dev
            ghcr.io/${{ github.repository }}/client:dev-${{ github.sha }}

  deploy-staging:
    needs: run-tests
    if: github.event_name == 'push' && github.ref_name == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Angular Client (Nx)
        run: npx nx build client --configuration=hosted-staging

      - name: Deploy Frontend to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'signingroom-web-staging'
          directory: 'dist/apps/client/browser'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: 'staging'

      - name: Deploy Backend to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging
          workingDirectory: 'apps/worker'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Worker Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/worker:staging
            ghcr.io/${{ github.repository }}/worker:staging-${{ github.sha }}

      - name: Build and Push Client Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.client
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/client:staging
            ghcr.io/${{ github.repository }}/client:staging-${{ github.sha }}

  deploy-prod:
    needs: run-tests
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Angular Client (Nx Production)
        run: npx nx build client --configuration=production

      - name: Deploy Frontend to Cloudflare Pages (Prod)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'signingroom-web'
          directory: 'dist/apps/client/browser'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: 'main'

      - name: Deploy Backend to Cloudflare Workers (Prod)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: 'apps/worker'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Worker Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/worker:latest
            ghcr.io/${{ github.repository }}/worker:${{ github.sha }}

      - name: Build and Push Client Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.client
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/client:latest
            ghcr.io/${{ github.repository }}/client:${{ github.sha }}
