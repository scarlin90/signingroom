name: CI/CD Pipeline

on:
  push:
    branches: ['main', 'staging', 'development']
  pull_request:
    branches: ['main', 'staging', 'development']
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Environment to deploy to (development, staging, main)'
        required: true
        default: 'main'
        type: choice
        options:
          - development
          - staging
          - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Run Semgrep Security Scan
        uses: docker://semgrep/semgrep@sha256:bdf7013b2c3634a487671158da77c554f531742326b543a9464d2adf6c433ac8
        with:
          args: semgrep scan --config p/typescript --error --severity ERROR --sarif --output semgrep.sarif

      - name: Upload Semgrep SARIF to GitHub UI
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Build Test Image (with Cache)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.test
          load: true
          tags: signingroom-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Tests
        run: docker run --name test-container signingroom-ci:latest

      - name: Extract Coverage Reports
        if: always()
        run: |
          docker cp test-container:/app/coverage/apps/worker/coverage-summary.json ./worker-summary.json || true
          docker cp test-container:/app/coverage/apps/worker/coverage-final.json ./worker-final.json || true

          docker cp test-container:/app/coverage/apps/client/coverage-summary.json ./client-summary.json || true
          docker cp test-container:/app/coverage/apps/client/coverage-final.json ./client-final.json || true

          docker cp test-container:/app/coverage/libs/sdk/coverage-summary.json ./sdk-summary.json || true
          docker cp test-container:/app/coverage/libs/sdk/coverage-final.json ./sdk-final.json || true

      - name: Post Worker Coverage to Summary
        if: always()
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2
        with:
          name: 'Worker Relay Coverage'
          json-summary-path: ./worker-summary.json
          json-final-path: ./worker-final.json

      - name: Post Client Coverage to Summary
        if: always()
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2
        with:
          name: 'Client Dashboard Coverage'
          json-summary-path: ./client-summary.json
          json-final-path: ./client-final.json

      - name: Post SDK Coverage to Summary
        if: always()
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2
        with:
          name: 'SDK Coverage'
          json-summary-path: ./sdk-summary.json
          json-final-path: ./sdk-final.json

      - name: Cleanup Docker
        if: always()
        run: docker rm -f test-container || true

  deploy-dev:
    needs: [run-tests]
    if: (github.event_name == 'push' && github.ref_name == 'development') || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'development')
    permissions:
      actions: write
      contents: read
      packages: write
      security-events: write
      id-token: write
    uses: ./.github/workflows/deploy-template.yml
    with:
      target_env: 'development'
      nx_config: 'hosted-dev'
      docker_tag: 'dev'
      pages_project: 'signingroom-web-dev'
      pages_branch: 'development'
      wrangler_args: 'deploy --env development'
      base_url: 'https://dev.signingroom.io'
    secrets: inherit

  deploy-staging:
    needs: [run-tests]
    if: (github.event_name == 'push' && github.ref_name == 'staging') || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'staging')
    permissions:
      actions: write
      contents: read
      packages: write
      security-events: write
      id-token: write
    uses: ./.github/workflows/deploy-template.yml
    with:
      target_env: 'staging'
      nx_config: 'hosted-staging'
      docker_tag: 'staging'
      pages_project: 'signingroom-web-staging'
      pages_branch: 'staging'
      wrangler_args: 'deploy --env staging'
      base_url: 'https://staging.signingroom.io'
    secrets: inherit

  deploy-staging-branded:
    needs: [run-tests]
    if: (github.event_name == 'push' && github.ref_name == 'staging') || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'staging')
    permissions:
      actions: write
      contents: read
      packages: write
      security-events: write
      id-token: write
    uses: ./.github/workflows/deploy-template.yml
    with:
      target_env: 'staging-branded'
      nx_config: 'hosted-staging-branded'
      docker_tag: 'staging-branded'
      pages_project: 'signingroom-web-staging-branded'
      pages_branch: 'staging'
      wrangler_args: 'deploy --env staging-branded'
      base_url: 'https://staging-branded.signingroom.io'
    secrets: inherit

  deploy-prod:
    needs: [run-tests]
    if: (github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'main')
    permissions:
      actions: write
      contents: read
      packages: write
      security-events: write
      id-token: write
    uses: ./.github/workflows/deploy-template.yml
    with:
      target_env: 'production'
      nx_config: 'production'
      docker_tag: 'latest'
      pages_project: 'signingroom-web'
      pages_branch: 'main'
      wrangler_args: 'deploy'
      base_url: 'https://signingroom.io'
    secrets: inherit

  slsa-provenance-worker:
    name: Worker SLSA Level 3 Provenance
    needs: [deploy-dev, deploy-staging, deploy-staging-branded, deploy-prod]
    if: always() && !cancelled() && (needs.deploy-dev.result == 'success' || needs.deploy-staging.result == 'success'|| needs.deploy-staging-branded.result == 'success' || needs.deploy-prod.result == 'success')
    permissions:
      actions: read
      id-token: write
      contents: read
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0 # pinning: ignore
    with:
      image: ghcr.io/${{ github.repository }}/worker
      digest: ${{ needs.deploy-dev.outputs.worker_digest || needs.deploy-staging.outputs.worker_digest || needs.deploy-staging-branded.outputs.worker_digest || needs.deploy-prod.outputs.worker_digest }}
    secrets:
      registry-username: ${{ github.actor }}
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  slsa-provenance-client:
    name: Client SLSA Level 3 Provenance
    needs: [deploy-dev, deploy-staging, deploy-staging-branded, deploy-prod]
    if: always() && !cancelled() && (needs.deploy-dev.result == 'success' || needs.deploy-staging.result == 'success' || needs.deploy-staging-branded.result == 'success' || needs.deploy-prod.result == 'success')
    permissions:
      actions: read
      id-token: write
      contents: read
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0 # pinning: ignore
    with:
      image: ghcr.io/${{ github.repository }}/client
      digest: ${{ needs.deploy-dev.outputs.client_digest || needs.deploy-staging.outputs.client_digest || needs.deploy-staging-branded.outputs.client_digest || needs.deploy-prod.outputs.client_digest }}
    secrets:
      registry-username: ${{ github.actor }}
      registry-password: ${{ secrets.GITHUB_TOKEN }}
