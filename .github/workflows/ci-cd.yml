name: CI/CD Pipeline

on:
  push:
    branches: ['main', 'staging', 'development']
  pull_request:
    branches: ['main', 'staging', 'development']
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Environment to deploy to (development, staging, main)'
        required: true
        default: 'main'
        type: choice
        options:
          - development
          - staging
          - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

