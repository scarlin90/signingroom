  deploy-dev:
    # needs: [run-tests]
    if: (github.event_name == 'push' && github.ref_name == 'development') || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'development')
    permissions:
      actions: read
      contents: write
      packages: write
      security-events: write
      deployments: write
      id-token: write
    uses: ./.github/workflows/deploy-template.yml
    with:
      target_env: 'development'
      nx_config: 'hosted-dev'
      docker_tag: 'dev'
      pages_project: 'signingroom-web-dev'
      pages_branch: 'development'
      wrangler_args: 'deploy --env development'
      base_url: 'https://dev.signingroom.io'
    secrets: inherit

