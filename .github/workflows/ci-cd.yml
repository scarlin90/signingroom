name: CI/CD Pipeline

on:
  push:
    branches: ['main', 'staging', 'development']
  pull_request:
    branches: ['main', 'staging', 'development']
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Environment to deploy to (development, staging, main)'
        required: true
        default: 'main'
        type: choice
        options:
          - development
          - staging
          - main

permissions:
  contents: write
  deployments: write
  packages: write
  pull-requests: write
  security-events: write
  id-token: write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install Semgrep
        run: python3 -m pip install semgrep

      - name: Run Semgrep Security Scan
        run: semgrep scan --config p/typescript --sarif --output semgrep.sarif

      - name: Upload Semgrep SARIF to GitHub UI
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Build Test Image (with Cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.test
          load: true
          tags: signingroom-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Tests
        run: docker run --name test-container signingroom-ci:latest

      - name: Extract Coverage Reports
        if: always()
        run: |
          docker cp test-container:/app/coverage/apps/worker/coverage-summary.json ./worker-summary.json || true
          docker cp test-container:/app/coverage/apps/worker/coverage-final.json ./worker-final.json || true

          docker cp test-container:/app/coverage/apps/client/coverage-summary.json ./client-summary.json || true
          docker cp test-container:/app/coverage/apps/client/coverage-final.json ./client-final.json || true

          docker cp test-container:/app/coverage/libs/sdk/coverage-summary.json ./sdk-summary.json || true
          docker cp test-container:/app/coverage/libs/sdk/coverage-final.json ./sdk-final.json || true

      - name: Post Worker Coverage to Summary
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: 'Worker Relay Coverage'
          json-summary-path: ./worker-summary.json
          json-final-path: ./worker-final.json

      - name: Post Client Coverage to Summary
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: 'Client Dashboard Coverage'
          json-summary-path: ./client-summary.json
          json-final-path: ./client-final.json

      - name: Post SDK Coverage to Summary
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: 'SDK Coverage'
          json-summary-path: ./sdk-summary.json
          json-final-path: ./sdk-final.json

      - name: Cleanup Docker
        if: always()
        run: docker rm -f test-container || true

  deploy-dev:
    needs: [run-tests]
    if: (github.event_name == 'push' && github.ref_name == 'development') || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'development')
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Software Bill of Materials (SBOM)
        run: |
          npx @cyclonedx/cyclonedx-npm --package-lock-only --output-format JSON --output-file sbom-dev.json --ignore-npm-errors

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-dev-${{ github.sha }}
          path: sbom-dev.json
          retention-days: 90

      - name: Build Angular Client (Nx)
        run: npx nx build client --configuration=hosted-dev

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Worker Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/worker:dev
            ghcr.io/${{ github.repository }}/worker:dev-${{ github.sha }}

      - name: Scan Worker Container for CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository }}/worker:dev-${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-dev.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Worker Trivy SARIF to GitHub UI
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-dev.sarif'
          category: trivy-dev

      - name: Build and Push Client Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.client
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/client:dev
            ghcr.io/${{ github.repository }}/client:dev-${{ github.sha }}

      - name: Scan Client Container for CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository }}/client:dev-${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-client-dev.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Client Trivy SARIF to GitHub UI
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-client-dev.sarif'
          category: trivy-client-dev

      - name: Deploy Frontend to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'signingroom-web-dev'
          directory: 'dist/apps/client/browser'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: 'development'

      - name: Deploy Backend to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env development
          workingDirectory: 'apps/worker'

  deploy-staging:
    needs: [run-tests]
    if: (github.event_name == 'push' && github.ref_name == 'staging') || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Software Bill of Materials (SBOM)
        run: |
          npx @cyclonedx/cyclonedx-npm --package-lock-only --output-format JSON --output-file sbom-staging.json --ignore-npm-errors

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-staging-${{ github.sha }}
          path: sbom-staging.json
          retention-days: 90

      - name: Build Angular Client (Nx)
        run: npx nx build client --configuration=hosted-staging

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Worker Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/worker:staging
            ghcr.io/${{ github.repository }}/worker:staging-${{ github.sha }}

      - name: Scan Worker Container for CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository }}/worker:staging-${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-staging.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Worker Trivy SARIF to GitHub UI
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-staging.sarif'
          category: trivy-staging

      - name: Build and Push Client Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.client
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/client:staging
            ghcr.io/${{ github.repository }}/client:staging-${{ github.sha }}

      - name: Scan Client Container for CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository }}/client:staging-${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-client-staging.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Client Trivy SARIF to GitHub UI
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-client-staging.sarif'
          category: trivy-client-staging

      - name: Deploy Frontend to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'signingroom-web-staging'
          directory: 'dist/apps/client/browser'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: 'staging'

      - name: Deploy Backend to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging
          workingDirectory: 'apps/worker'

  deploy-prod:
    needs: [run-tests]
    if: (github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_env == 'main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Software Bill of Materials (SBOM)
        run: |
          npx @cyclonedx/cyclonedx-npm --package-lock-only --output-format JSON --output-file sbom-prod.json --ignore-npm-errors

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-prod-${{ github.sha }}
          path: sbom-prod.json
          retention-days: 90

      - name: Build Angular Client (Nx Production)
        run: npx nx build client --configuration=production

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Worker Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/worker:latest
            ghcr.io/${{ github.repository }}/worker:${{ github.sha }}

      - name: Scan Worker Container for CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository }}/worker:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-prod.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Worker Trivy SARIF to GitHub UI
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-prod.sarif'
          category: trivy-prod

      - name: Build and Push Client Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.client
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/client:latest
            ghcr.io/${{ github.repository }}/client:${{ github.sha }}

      - name: Scan Client Container for CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository }}/client:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-client-prod.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Client Trivy SARIF to GitHub UI
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-client-prod.sarif'
          category: trivy-client-prod

      - name: Deploy Frontend to Cloudflare Pages (Prod)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'signingroom-web'
          directory: 'dist/apps/client/browser'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: 'main'

      - name: Deploy Backend to Cloudflare Workers (Prod)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: 'apps/worker'
