name: Sign GitHub Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  sign-release:
    name: Generate and Sign Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Software Bill of Materials (SBOM)
        run: |
          set -euxo pipefail
          npx @cyclonedx/cyclonedx-npm \
            --package-lock-only \
            --output-format JSON \
            --output-file release-sbom.json \
            --ignore-npm-errors || true

          if [ ! -s release-sbom.json ]; then
            echo "ERROR: release-sbom.json was not created or is empty"
            exit 1
          fi
          ls -l release-sbom.json
          echo "SBOM size: $(wc -c < release-sbom.json) bytes"

      - name: Upload unsigned SBOM (debug)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom-unsigned-${{ github.event.release.tag_name }}
          path: release-sbom.json
          retention-days: 14

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.1'

      - name: Sign the SBOM
        run: |
          set -euxo pipefail
          test -s release-sbom.json
          cosign version

          # .sigstore.json is recognized by OpenSSF Scorecard
          BUNDLE="${PWD}/release-sbom.json.sigstore.json"
          echo "Signing with --bundle=${BUNDLE}"

          cosign sign-blob \
            --bundle "${BUNDLE}" \
            --yes \
            release-sbom.json

          test -s "${BUNDLE}"
          ls -l "${BUNDLE}"
          echo "Signed bundle written to ${BUNDLE}"

      - name: Upload Signed Artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          test -s release-sbom.json
          test -s release-sbom.json.sigstore.json

          gh release upload "${{ github.event.release.tag_name }}" \
            release-sbom.json \
            release-sbom.json.sigstore.json \
            --clobber

          echo "Uploaded assets:"
          gh release view "${{ github.event.release.tag_name }}" --json assets --jq '.assets[].name'
