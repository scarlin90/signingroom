name: Sign GitHub Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sign-release:
    name: Generate and Sign Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install Root Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Client Software Bill of Materials (SBOM)
        run: |
          set -euxo pipefail
          npx @cyclonedx/cyclonedx-npm \
            --output-format JSON \
            --output-file client-sbom.json \
            --ignore-npm-errors || true

      - name: Install Worker Dependencies
        run: |
          cd apps/worker
          npm install --legacy-peer-deps

      - name: Generate Worker Software Bill of Materials (SBOM)
        run: |
          set -euxo pipefail
          cd apps/worker
          npx @cyclonedx/cyclonedx-npm \
            --output-format JSON \
            --output-file ../worker-sbom.json \
            --ignore-npm-errors || true
          cd ..

      - name: Verify SBOM Generation
        run: |
          if [ ! -s client-sbom.json ] || [ ! -s worker-sbom.json ]; then
            echo "ERROR: One or more SBOM files were not created or are empty"
            exit 1
          fi

      - name: Upload unsigned SBOMs (debug)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms-unsigned-${{ github.event.release.tag_name }}
          path: |
            client-sbom.json
            worker-sbom.json
          retention-days: 90

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.1'

      - name: Sign the SBOMs
        run: |
          set -euxo pipefail
          cosign version

          BUNDLE_CLIENT="${PWD}/client-sbom.json.sigstore.json"
          BUNDLE_WORKER="${PWD}/worker-sbom.json.sigstore.json"

          echo "Signing Client SBOM"
          cosign sign-blob \
            --bundle "${BUNDLE_CLIENT}" \
            --yes \
            client-sbom.json

          echo "Signing Worker SBOM"
          cosign sign-blob \
            --bundle "${BUNDLE_WORKER}" \
            --yes \
            worker-sbom.json

      - name: Upload Signed Artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail

          gh release upload "${{ github.event.release.tag_name }}" \
            client-sbom.json \
            client-sbom.json.sigstore.json \
            worker-sbom.json \
            worker-sbom.json.sigstore.json \
            --clobber

          echo "Uploaded assets:"
          gh release view "${{ github.event.release.tag_name }}" --json assets --jq '.assets[].name'