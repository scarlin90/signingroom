name: Sign GitHub Release

on:
  release:
    types: [published]

permissions:
  contents: write # Required to upload assets to the GitHub Release
  id-token: write # Required for Sigstore/Cosign keyless signing

jobs:
  sign-release:
    name: Generate and Sign Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Software Bill of Materials (SBOM)
        run: |
          set -euxo pipefail
          npx @cyclonedx/cyclonedx-npm \
            --package-lock-only \
            --output-format JSON \
            --output-file release-sbom.json \
            --ignore-npm-errors

          # Fail early if the SBOM was not produced or is empty
          test -s release-sbom.json
          ls -l release-sbom.json
          echo "SBOM generated successfully ($(wc -c < release-sbom.json) bytes)"

      - name: Upload unsigned SBOM (debug / fallback)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom-unsigned-${{ github.event.release.tag_name }}
          path: release-sbom.json
          retention-days: 14

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the SBOM
        run: |
          set -euxo pipefail

          # Confirm input exists
          test -s release-sbom.json

          cosign version

          # Absolute path avoids any relative-path / empty BundlePath issues
          cosign sign-blob \
            --bundle "${PWD}/release-sbom.json.bundle" \
            --yes \
            release-sbom.json

          # Confirm the signed bundle was written
          test -s release-sbom.json.bundle
          ls -l release-sbom.json.bundle
          echo "SBOM signed successfully"

      - name: Upload Signed Artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail

          # Final safety checks before upload
          test -s release-sbom.json
          test -s release-sbom.json.bundle

          echo "Uploading assets to release ${{ github.event.release.tag_name }}..."
          gh release upload "${{ github.event.release.tag_name }}" \
            release-sbom.json \
            release-sbom.json.bundle \
            --clobber

          echo "Upload complete"
          gh release view "${{ github.event.release.tag_name }}" --json assets --jq '.assets[].name'
