name: CI Test Suite

on:
  push:
    branches: ['main', 'staging', 'development']
  pull_request:
    branches: ['main', 'staging', 'development']

permissions:
  contents: write
  pull-requests: write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Build and Run Tests
        run: |
          docker build -t signingroom-ci -f Dockerfile.test .
          # Run without --rm so we can extract files afterward
          docker run --name test-container signingroom-ci

      - name: Extract Coverage Summaries
        if: always()
        run: |
          docker cp test-container:/app/coverage/apps/worker/coverage-summary.json ./worker-summary.json || true
          docker cp test-container:/app/coverage/apps/client/coverage-summary.json ./client-summary.json || true
          docker cp test-container:/app/coverage/libs/sdk/coverage-summary.json ./sdk-summary.json || true

      - name: Post Worker Coverage to Summary
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: 'Worker Relay Coverage'
          json-summary-path: ./worker-summary.json

      - name: Post Client Coverage to Summary
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: 'Client Dashboard Coverage'
          json-summary-path: ./client-summary.json

      - name: Post SDK Coverage to Summary
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: 'SDK Coverage'
          json-summary-path: ./sdk-summary.json

      - name: Cleanup Docker
        if: always()
        run: docker rm -f test-container || true

      - name: Generate Automated SBOM
        if: github.event_name == 'push' && github.ref_name == 'development'
        run: |
          echo "Compiling automated Software Bill of Materials (CycloneDX)..."
          npx @cyclonedx/cyclonedx-npm --package-lock-only --output-format JSON --output-file sbom.json --ignore-npm-errors

      - name: Create Pull Request for SBOM
        if: github.event_name == 'push' && github.ref_name == 'development'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(compliance): auto-update software bill of materials (SBOM)'
          title: 'chore(compliance): update SBOM'
          body: 'Automated Software Bill of Materials (SBOM) update generated by GitHub Actions.'
          branch: auto-update-sbom
          base: development
          add-paths: sbom.json
