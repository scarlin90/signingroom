name: CI Test Suite

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]

permissions:
  contents: write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Run Tests
        run: |
          docker build -t signingroom-ci -f Dockerfile.test .
          # Run without --rm so we can extract files afterward
          docker run --name test-container signingroom-ci

      - name: Extract Coverage Summaries
        if: always()
        run: |
          docker cp test-container:/app/coverage/apps/worker/coverage-summary.json ./worker-summary.json
          docker cp test-container:/app/coverage/apps/client/coverage-summary.json ./client-summary.json

      - name: Post Worker Coverage to Summary
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: "Worker Relay Coverage"
          json-summary-path: ./worker-summary.json

      - name: Post Client Coverage to Summary
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: "Client Dashboard Coverage"
          json-summary-path: ./client-summary.json

      - name: Cleanup Docker
        if: always()
        run: docker rm test-container

      - name: Generate Automated SBOM
        if: github.event_name == 'push' # Only generate on pushes, not PR reviews
        run: |
          echo "Compiling automated Software Bill of Materials (CycloneDX)..."
          npx @cyclonedx/cyclonedx-npm --package-lock-only --output-format JSON --output-file sbom.json --ignore-npm-errors

      - name: Commit and Push Updated SBOM
        if: github.event_name == 'push'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Only stage changes if the sbom.json file has actually mutated
          if ! git diff --exit-code sbom.json; then
            git add sbom.json
            git commit -m "chore(compliance): auto-update software bill of materials (SBOM) [skip ci]"
            git push origin ${{ github.ref_name }}
          else
            echo "No dependencies changed. SBOM is completely up to date."
          fi