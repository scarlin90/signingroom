<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Wallet | Dashboard</title>
    <style>
        :root { --bg: #020617; --card: #0f172a; --accent: #10b981; }
        body { background: var(--bg); color: white; font-family: system-ui, -apple-system, sans-serif; padding: 2rem; margin: 0; }
        .container { max-width: 1000px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 350px; gap: 2rem; }
        .card { background: var(--card); padding: 1.5rem; border-radius: 16px; border: 1px solid #1e293b; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .badge { background: rgba(16, 185, 129, 0.1); color: var(--accent); padding: 4px 12px; border-radius: 99px; font-size: 12px; font-weight: bold; }
        h2 { margin: 0 0 1rem 0; font-size: 1.25rem; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.5; }
        .btn { background: var(--accent); color: #020617; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        /* Style for the Signing Room widget container */
        .widget-container { min-height: 650px; overflow: hidden; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div>
                <h1 style="margin:0">Sovereign Wallet</h1>
                <p style="margin:5px 0 0">Multisig Coordination Dashboard</p>
            </div>
            <div class="badge">Signet Network Active</div>
        </div>

        <div class="dashboard-grid">
            <div class="card widget-container">
                <h2 style="display: flex; align-items: center; gap: 10px;">
                    Signing Room® <span style="font-size: 10px; opacity: 0.5; font-weight: normal;">v1.8.0</span>
                </h2>
                
                <signing-room 
                    id="multisig-widget" 
                    network="signet" 
                    relay-endpoint="http://localhost:4200">
                </signing-room>
            </div>

            <div class="space-y" style="display: flex; flex-direction: column; gap: 1.5rem;">
                <div class="card">
                    <h2>Coordinator Tools</h2>
                    <p>Simulate a wallet generating a massive 10MB PSBT and injecting it into the Stateless Widget.</p>
                    <button class="btn" id="inject-btn">Inject 10MB PSBT</button>
                </div>

                <div class="card" id="event-log" style="flex-grow: 1;">
                    <h2>Audit Events</h2>
                    <div id="log-output" style="font-family: monospace; font-size: 11px; color: #64748b;">
                        Waiting for interaction...
                    </div>
                </div>
            </div>
        </div>
    </div>
