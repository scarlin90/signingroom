<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Background (Strategy Deep Graphite) -->
  <rect width="100%" height="100%" fill="#0f0f0f" rx="16"/>

  <!-- Centered Geometric Cube / Emblem -->
  <g transform="translate(10, 8)">
    <!-- Top facet (Bright highlight) -->
    <path d="M 50,0 L 95,26 L 50,55 L 5,26 Z" fill="#ff9d5c"/>
    
    <!-- Top-right facet (Slightly darker orange) -->
    <path d="M 95,26 L 95,78 L 50,55 Z" fill="#e05200"/>
    
    <!-- Bottom-right facet (Deep orange shadow) -->
    <path d="M 95,78 L 50,104 L 50,55 Z" fill="#b34100"/>
    
    <!-- Bottom-left facet (Darkest ambient shadow) -->
    <path d="M 50,104 L 5,78 L 50,55 Z" fill="#662500"/>
    
    <!-- Left vertical facet (Primary vibrant accent) -->
    <path d="M 5,78 L 5,26 L 50,55 Z" fill="#ff5c00"/>
    
    <!-- Inner geometric core accent -->
    <polygon points="50,55 75,70 50,85 25,70" fill="#ffffff" opacity="0.3"/>
  </g>
</svg>